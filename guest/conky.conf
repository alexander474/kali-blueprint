conky.config = {
  alignment = 'top_right', background = true, update_interval = 2,
  double_buffer = true, use_xft = true, font = 'DejaVu Sans Mono:size=10',
  own_window = true, own_window_type = 'normal',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  draw_shades = false, default_color = 'C8D4DD', color1 = '78B8DA',
  gap_x = 26, gap_y = 66, minimum_width = 260, maximum_width = 260,
};
conky.text = [[
${color1}${font DejaVu Sans Mono:size=13}KALI${font}${color}
${nodename}
${color1}${hr 1}${color}
${execi 5 python3 /usr/local/lib/kali-blueprint/network.py}

CPU${alignr}${cpu}%
RAM${alignr}${mem} / ${memmax}
Disk /${alignr}${fs_free /} ledig
Oppetid${alignr}${uptime_short}

${time %d.%m.%Y}
${time %H:%M:%S}
]];
